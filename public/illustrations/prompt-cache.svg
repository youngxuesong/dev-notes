<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt caching</title><desc id="desc">A small black operator places a stable prompt block into a cool storage box while only a small request changes.</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <g fill="none" stroke="#171717" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 220 h520 v390 H350Z"/>
    <path d="M450 330 h320 M450 400 h260 M450 470 h180" stroke="#3d78b8"/>
    <path d="M1050 260 h280 v350 h-280Z"/>
    <path d="M1100 350 h180 M1100 420 h150" stroke="#e67e22"/>
    <path d="M870 420 h180" stroke="#e67e22"/><path d="M1020 390 l35 30 -35 30" stroke="#e67e22"/>
    <path d="M430 680 h850" stroke="#e74c3c"/><path d="M610 670 v-55 M1160 670 v-55" stroke="#e74c3c"/>
  </g>
  <g fill="#171717">
    <path d="M835 400 C832 360 863 334 899 342 C931 349 944 379 932 408 C920 437 887 448 860 435 C847 429 838 418 835 400Z"/>
    <path d="M855 435 l-6 64 M901 434 l8 64" fill="none" stroke="#171717" stroke-width="9" stroke-linecap="round"/>
    <circle cx="865" cy="373" r="7" fill="#fff"/><circle cx="893" cy="373" r="7" fill="#fff"/>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" fill="#171717">
    <text x="490" y="180">稳定前缀</text><text x="1100" y="215">缓存</text><text x="1090" y="675" fill="#e74c3c">只更新变化</text>
    <text x="690" y="760" fill="#3d78b8">少重复一点</text>
  </g>
</svg>
