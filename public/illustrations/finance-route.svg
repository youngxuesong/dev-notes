  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="36" fill="#171717">
    <text x="225" y="165">产品收入</text><text x="1050" y="180">账户</text><text x="600" y="190">路由</text><text x="390" y="740" fill="#e74c3c">算力订阅</text><text x="850" y="740" fill="#3d78b8">资金闭环</text>
  </g>
