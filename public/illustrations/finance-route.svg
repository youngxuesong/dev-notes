<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-border finance route</title><desc id="desc">A small black operator rolls one payment coin across a bridge from a product to several accounts.</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <g fill="none" stroke="#171717" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 560 Q440 300 690 560 T1190 560"/>
    <path d="M690 560 V250" stroke="#e67e22"/><path d="M690 250 l-25 48 M690 250 l25 48" stroke="#e67e22"/>
    <circle cx="300" cy="260" r="100"/><path d="M255 260 h90 M300 215 v90"/>
    <path d="M1030 260 q100 -70 200 0 v150 q-100 70 -200 0Z"/>
    <path d="M1100 300 v75 M1065 338 h70" stroke="#3d78b8"/>
    <path d="M365 650 h220 M805 650 h300" stroke="#e74c3c"/>
  </g>
  <g fill="#171717">
